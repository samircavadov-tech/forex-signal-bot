name: Forex siqnallari

on:
  schedule:
    # Hər saat :07-də (UTC). Forex bazarı: bazar günü 21:00 – cümə 21:00 UTC.
    - cron: "7 * * * 1-5"
    - cron: "7 21-23 * * 0"
  workflow_dispatch:   # Actions səhifəsindən əl ilə işə salmaq üçün

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      # Əvvəlki işin yaddaşı (artıq yoxlanılmış şamlar) — eyni siqnal iki dəfə gəlməsin
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - run: python main.py --cloud
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
