name: Forex siqnallari

on:
  schedule:
    # Saatda 2 dəfə (UTC). Saat başı GitHub-da yük çox olur və planlı işlər buraxıla bilər,
    # ona görə :23 və :43 seçilib; eyni şam iki dəfə yoxlanmır (state.json).
    # Forex bazarı: bazar günü 21:00 – cümə 21:00 UTC.
    - cron: "23,43 * * * 1-5"
    - cron: "23,43 21-23 * * 0"
  workflow_dispatch:   # Actions səhifəsindən əl ilə işə salmaq üçün
    inputs:
      telegram_test:
        description: "Telegram-a test mesajı göndər"
        type: boolean
        default: false

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - run: pip install -r requirements-cloud.txt

      # Əvvəlki işin yaddaşı (artıq yoxlanılmış şamlar) — eyni siqnal iki dəfə gəlməsin
      - uses: actions/cache/restore@v5
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - if: ${{ inputs.telegram_test }}
        run: python main.py --test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - run: python main.py --cloud
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
